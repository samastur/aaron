name: Aaron
options:
  bundleIdPrefix: net.gaivo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AaronKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Aaron:
    type: application
    platform: macOS
    sources:
      - path: Sources/Aaron
    dependencies:
      - package: AaronKit
        product: AaronCore
      - package: AaronKit
        product: AaronPreview
      - package: AaronKit
        product: AaronAI
      - package: AaronKit
        product: AaronPelican
      - package: AaronKit
        product: AaronHelp
    settings:
      base:
        PRODUCT_NAME: Aaron
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Aaron/Info.plist
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.Aaron.debug
          AARON_DISPLAY_NAME: Aaron Debug
          AARON_SUPPORT_FOLDER: Aaron Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.Aaron
          AARON_DISPLAY_NAME: Aaron
          AARON_SUPPORT_FOLDER: Aaron
    info:
      path: Sources/Aaron/Info.plist
      properties:
        CFBundleDisplayName: $(AARON_DISPLAY_NAME)
        AaronSupportFolderName: $(AARON_SUPPORT_FOLDER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Marko Samastur"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown]
  AaronTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Aaron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.AaronTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Aaron.app/Contents/MacOS/Aaron
        BUNDLE_LOADER: $(TEST_HOST)
  AaronUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes: ["Fixtures/**"]
      - path: UITests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Aaron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.AaronUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aaron
schemes:
  Aaron:
    build:
      targets:
        Aaron: all
        AaronTests: [test]
        AaronUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        - variable: AARON_SUPPORT_DIR
          value: $(BUILD_DIR)/test-host-support
          isEnabled: true
      targets:
        - AaronTests
        - AaronUITests
